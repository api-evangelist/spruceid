- name: SpruceID isomdl Mobile Driver's License API
  description: >-
    SpruceID's isomdl library provides a Rust implementation of the ISO/IEC 18013-5 standard for mobile
    driver's licenses (mDL). It enables issuers to create standards-compliant mDL credentials and verifiers
    to request and validate presentations both online and in offline (proximity) scenarios. The library
    is integrated into SpruceKit mobile SDKs for iOS and Android, supporting real-world deployment of
    government-issued digital identity documents.
  image: https://spruceid.com/favicon.ico
  humanURL: https://github.com/spruceid/isomdl
  baseURL: https://crates.io/crates/isomdl
