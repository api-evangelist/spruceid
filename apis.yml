- name: SpruceID OID4VCI Credential Issuance API
  description: >-
    SpruceID's OID4VCI (OpenID for Verifiable Credential Issuance) Rust library implements the OpenID4VC
    credential issuance protocol, enabling credential issuers to deliver W3C Verifiable Credentials to
    holder wallets. The protocol extends OAuth 2.0 with credential endpoint flows including pre-authorized
    code flow and authorization code flow. Supported credential formats include JWT-VC, LDP-VC, SD-JWT
    VC, and ISO/IEC 18013-5 mobile documents (mDL). Used as the issuance layer in the SpruceKit mobile
    SDK.
  image: https://spruceid.com/favicon.ico
  humanURL: https://github.com/spruceid/oid4vci-rs
  baseURL: https://openid.net/specs/openid-4-verifiable-credential-issuance-1_0.html
  tags:
