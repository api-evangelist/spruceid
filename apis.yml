- name: SpruceID SSI Core Library API
  description: >-
    The SpruceID SSI (Self-Sovereign Identity) core library provides a comprehensive Rust API for signing,
    issuing, and verifying W3C Verifiable Credentials and JSON Web Tokens. It supports VC Data Model 1.1
    and 2.0, JWT-VC, Data Integrity proofs, BBS+ selective disclosure, and a wide range of cryptographic
    signature suites including EdDSA, secp256k1, P-256, and more. The library has undergone a Trail of
    Bits security audit and serves as the foundation for DIDKit and other SpruceID tooling.
  image: https://spruceid.com/favicon.ico
  humanURL: https://github.com/spruceid/ssi
  baseURL: https://crates.io/crates/ssi
  tags:
