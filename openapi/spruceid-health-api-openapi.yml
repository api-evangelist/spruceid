openapi: 3.2.0
info:
  title: SpruceID DIDKit HTTP Health API
  description: DIDKit is SpruceID's cross-platform toolkit for working with W3C Decentralized Identifiers (DIDs) and Verifiable Credentials (VCs).
  version: 1.0.0
  contact:
    name: SpruceID Developer Support
    email: hello@spruceid.com
    url: https://spruceid.dev/docs/didkit/
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  x-logo:
    url: https://spruceid.com/favicon.ico
servers:
- url: http://localhost:8080
  description: Local DIDKit HTTP server instance
tags:
- name: Health
  description: Health check endpoints
paths:
  /healthz:
    get:
      summary: Health Check
      description: Returns a 200 OK if the server is running and healthy.
      operationId: healthCheck
      tags:
      - Health
      responses:
        '200':
          description: Server is healthy
externalDocs:
  description: SpruceID DIDKit Documentation
  url: https://spruceid.dev/docs/didkit/
